<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>Día del Padre - iCo Medios</title>

<meta http-equiv="refresh" content="180">

<link rel="stylesheet" href="https://use.typekit.net/vsp7vcb.css">

<style>

html,
body{

  margin:0;
  padding:0;

  width:100%;
  height:100%;

  overflow:hidden;

  background:#ffffff;
}

.contenedor{

  position:relative;

  width:1872px;
  height:312px;

  overflow:hidden;

  transform-origin:top left;
}

/* VIDEO */

#fondoVideo{

  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;

  z-index:0;
}

/* CAPA DE TEXTO */

#nombres{

  position:absolute;

  inset:0;

  z-index:5;
}

/* MENSAJE */

.dicho{

  position:absolute;

  top:35px;

  left:130px;

  width:1612px;

  text-align:center;

  color:#0000EC;

  font-size:48px;

  line-height:1.2;

  font-family:"filson-soft",sans-serif;

  font-weight:700;

  font-style:normal;

  opacity:0;

  transition:opacity .8s ease;
}

/* NOMBRE PAPÁ */

.nombre{

  position:absolute;

  top:220px;

  left:130px;

  width:1612px;

  text-align:center;

  color:#0000EC;

  font-size:42px;

  font-family:"filson-soft",sans-serif;

  font-weight:700;

  font-style:normal;

  opacity:0;

  transition:opacity .8s ease;
}

.mostrar{

  opacity:1;
}

</style>

</head>

<body>

<div class="contenedor">

  <video autoplay muted loop playsinline id="fondoVideo">

    <source src="fondo.mp4" type="video/mp4">

  </video>

  <div id="nombres">

    <div class="dicho"></div>

    <div class="nombre"></div>

  </div>

</div>

<script>

function escalarPantalla(){

  const escalaX = window.innerWidth / 1872;

  const escalaY = window.innerHeight / 312;

  const escala = Math.min(escalaX, escalaY);

  document.querySelector(".contenedor").style.transform =
    `scale(${escala})`;
}

window.addEventListener("resize", escalarPantalla);

escalarPantalla();

const url =
"https://TU_URL_DEL_APPS_SCRIPT";

const elNombre =
document.querySelector(".nombre");

const elDicho =
document.querySelector(".dicho");

fetch(url)

.then(response => response.json())

.then(data => {

  if(!data || data.length === 0){

    elDicho.textContent =
    "No hay mensajes aprobados";

    elDicho.classList.add("mostrar");

    return;
  }

  let index = Math.floor(Math.random() * data.length);

  function mostrarMensaje(){

    const item = data[index];

    elNombre.classList.remove("mostrar");

    elDicho.classList.remove("mostrar");

    setTimeout(() => {

      elNombre.textContent =
      item.papa
      ? item.papa.toUpperCase()
      : "--";

      elDicho.textContent =
      item.mensaje
      ? `"${item.mensaje}"`
      : "";

      elNombre.classList.add("mostrar");

      elDicho.classList.add("mostrar");

    },300);

    index++;

    if(index >= data.length){

      index = 0;
    }

  }

  mostrarMensaje();

  setInterval(mostrarMensaje,5000);

})

.catch(error => {

  console.error(error);

  elDicho.textContent =
  "Error cargando mensajes";

  elDicho.classList.add("mostrar");

});

</script>

</body>
</html>
