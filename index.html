<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>Día del Padre - iCo Medios</title>

<meta http-equiv="refresh" content="180">

<link rel="stylesheet" href="https://use.typekit.net/vsp7vcb.css">

<style>

html,
body{

  margin:0;
  padding:0;

  width:100%;
  height:100%;

  overflow:hidden;

  background:#ffffff;
}

.contenedor{

  position:relative;

  width:1872px;
  height:312px;

  overflow:hidden;

  transform-origin:top left;
}

/* VIDEO */

#fondoVideo{

  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;

  z-index:0;
}

/* CONTENEDOR DE TEXTOS */

#nombres{

  position:absolute;

  inset:0;

  z-index:5;
}

/* MENSAJE */

.dicho{

  position:absolute;

  top:35px;

  left:497px;

  width:479px;

  text-align:center;

  color:#0000EC;

  font-size:4px;

  line-height:1.2;

  font-family:"filson-soft", sans-serif;

  font-weight:676;

  font-style:normal;

  opacity:0;

  transition:opacity .8s ease;
}

/* NOMBRE PAPÁ */

.nombre{

  position:absolute;

  top:196px;

  left:-63px;

  width:1632px;

  text-align:center;

  color:#0000EC;

  font-size:34px;

  font-family:"filson-soft", sans-serif;

  font-weight:700;

  font-style:normal;

  opacity:0;

  transition:opacity .8s ease;
}

.mostrar{

  opacity:1;
}

</style>

</head>

<body>

<div class="contenedor">

  <!-- VIDEO -->

  <video autoplay muted loop playsinline id="fondoVideo">

    <source src="fondo.mp4" type="video/mp4">

  </video>

  <!-- TEXTOS -->

  <div id="nombres">

    <div class="dicho"></div>

    <div class="nombre"></div>

  </div>

</div>

<script>

/* ESCALADO */

function escalarPantalla(){

  const escalaX = window.innerWidth / 1872;

  const escalaY = window.innerHeight / 312;

  const escala = Math.min(escalaX, escalaY);

  document.querySelector(".contenedor").style.transform =
  `scale(${escala})`;
}

window.addEventListener("resize", escalarPantalla);

escalarPantalla();

/* URL APPS SCRIPT */

const url =
"https://script.googleusercontent.com/macros/echo?user_content_key=AUkAhnR9sKMc4V_LT0YpJPKgHrTJdw0886LZpZCfFNDpmgqn_PWAkG04bVDbX9kRZgvbFEqfoXH3m59Qk4I-xa_oOHjfdYnsQVZEZGK-I4CHcEfwd6hcV7aFEe_RcBuls2LkfXbRrxyQ5Z0Ga_0Q4tYTUKnD148IiUGF0u1wOkY2LsiW_5PKXaTSE84s06IXxbrC52CGNkw2ZrPMqT1vigNBDcUHE2P6ld_vTvwYRaKn4lj6FagP0VZjSNexLfGeTOgNPvK-AFa0CvCvWO7wVAbZb8yo0mX2MQ&lib=MLNAcr3Jke4q8WCYQeQbKPKeEHa1C_Htb";

const elNombre = document.querySelector(".nombre");

const elDicho = document.querySelector(".dicho");

fetch(url)

.then(response => response.json())

.then(data => {

  console.log(data);

  if(!data || data.length === 0){

    elNombre.textContent = "";

    elDicho.textContent = "No hay mensajes aprobados";

    elDicho.classList.add("mostrar");

    return;
  }

  let index = Math.floor(Math.random() * data.length);

  function ajustarFuente(texto){

    const longitud = texto.length;

    if(longitud <= 50){

      elDicho.style.fontSize = "48px";

    }else if(longitud <= 90){

      elDicho.style.fontSize = "42px";

    }else{

      elDicho.style.fontSize = "36px";

    }
  }

  function mostrarMensaje(){

    const item = data[index];

    elNombre.classList.remove("mostrar");

    elDicho.classList.remove("mostrar");

    setTimeout(() => {

      const mensaje = item.mensaje || "";

      ajustarFuente(mensaje);

      elNombre.textContent =

        item.papa

        ? item.papa.toUpperCase()

        : "--";

      elDicho.textContent =

        mensaje

        ? `"${mensaje}"`

        : "";

      elNombre.classList.add("mostrar");

      elDicho.classList.add("mostrar");

    },300);

    index++;

    if(index >= data.length){

      index = 0;
    }
  }

  mostrarMensaje();

  setInterval(mostrarMensaje,5000);

})

.catch(error => {

  console.error(error);

  elNombre.textContent = "";

  elDicho.textContent = "Error cargando mensajes";

  elDicho.classList.add("mostrar");

});

</script>

</body>

</html>
